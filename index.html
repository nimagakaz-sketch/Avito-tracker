<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Avito Tracker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #2ea043;
      --accent-glow: rgba(46, 160, 67, 0.35);
      --danger: #f85149;
      --blue: #388bfd;
      --blue-glow: rgba(56, 139, 253, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px 16px 120px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .pulse-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid rgba(46, 160, 67, 0.3);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #3fb950;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: #3fb950;
      border-radius: 50%;
      box-shadow: 0 0 8px #3fb950;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    .tabs-nav {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 18px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 10px;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .tab-content.active {
      display: flex;
    }

    .task-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .task-name {
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.3;
    }

    .task-url-tag {
      font-size: 11px;
      color: var(--blue);
      background: var(--blue-glow);
      padding: 3px 8px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      margin-top: 4px;
      max-width: 210px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }

    .task-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .meta-box p:first-child {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .meta-box p:last-child {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-top: 2px;
    }

    .market-pill {
      color: #388bfd !important;
    }

    .add-task-btn {
      width: 100%;
      padding: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px dashed rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background: #161b22;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px 24px 0 0;
      width: 100%;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.active .modal-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin: -10px auto 16px;
    }

    .sheet-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 14px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 15px;
      color: #fff;
      outline: none;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .sheet-btns {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 12px;
      margin-top: 18px;
    }

    .btn-secondary {
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: #238636;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>Avito Tracker</h1>
      <p>Мониторинг цен в реальном времени</p>
    </div>
    <div class="pulse-badge">
      <div class="pulse-dot"></div>
      Онлайн
    </div>
  </header>

  <div class="tabs-nav">
    <button class="tab-btn active">⚙️ Активные поиски</button>
  </div>

  <div class="tab-content active">
    <div class="task-list" id="taskList"></div>
    <button class="add-task-btn" id="btnOpenAdd">
      <span>➕</span> Добавить модель для отслеживания
    </button>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="modalTitle">Настройка поиска</div>

      <div class="form-group">
        <label>Название модели</label>
        <input type="text" id="inputTitle" class="form-input" placeholder="Например: iPhone 15 Pro">
      </div>

      <div class="form-group">
        <label>Ссылка поиска на Авито</label>
        <input type="text" id="inputUrl" class="form-input" placeholder="https://m.avito.ru/kemerovo/telefony/...">
      </div>

      <div class="input-row">
        <div class="form-group">
          <label>Мин. цена (₽)</label>
          <input type="number" id="inputMin" class="form-input" placeholder="5000">
        </div>
        <div class="form-group">
          <label>Макс. цена (₽)</label>
          <input type="number" id="inputMax" class="form-input" placeholder="120000">
        </div>
      </div>

      <div class="sheet-btns">
        <button class="btn-secondary" id="btnCancel">Отмена</button>
        <button class="btn-primary" id="btnSave">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Дефолтный список моделей, если URL открыт без параметров
    let tasks = [
      {
        id: "1",
        title: "iPhone 13",
        url: "https://m.avito.ru/kemerovo/telefony/mobilnye_telefony/apple/iphone_13-ASgBAgICA0SywA2kmzm0wA30qzmwwQ2M_Dc?s=104",
        min_price: 20000,
        max_price: 55000,
        avg_price: 28813
      },
      {
        id: "2",
        title: "iPhone 15 Кемерово",
        url: "https://m.avito.ru/kemerovo/telefony/mobilnye_telefony/apple/iphone_15-ASgBAgICA0SywA2kmzm0wA30qzmwwQ2I_Dc?s=104",
        min_price: 30000,
        max_price: 85000,
        avg_price: 64490
      },
      {
        id: "3",
        title: "iPhone 11",
        url: "https://m.avito.ru/kemerovo/telefony/mobilnye_telefony/apple/iphone_11-ASgBAgICA0SywA2kmzm0wA30qzmwwQ2E_Dc?s=104",
        min_price: 7000,
        max_price: 22000,
        avg_price: 9443
      },
      {
        id: "4",
        title: "iPhone 14 Pro",
        url: "https://m.avito.ru/kemerovo/telefony/mobilnye_telefony/apple/iphone_14_pro-ASgBAgICA0SywA2kmzm0wA30qzmwwQ2K_Dc?s=104",
        min_price: 40000,
        max_price: 95000,
        avg_price: 0
      }
    ];

    let editTaskId = null;

    function safeBase64Decode(str) {
      try {
        const binString = atob(str);
        const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
        return new TextDecoder().decode(bytes);
      } catch (e) {
        return decodeURIComponent(escape(atob(str)));
      }
    }

    function initData() {
      try {
        const params = new URLSearchParams(window.location.search);
        const encoded = params.get("data");
        if (encoded) {
          const decodedStr = safeBase64Decode(encoded);
          const payload = JSON.parse(decodedStr);
          if (Array.isArray(payload) && payload.length > 0) {
            tasks = payload;
          } else if (payload && typeof payload === 'object' && Array.isArray(payload.tasks) && payload.tasks.length > 0) {
            tasks = payload.tasks;
          }
        }
      } catch (e) {
        console.error("Ошибка чтения данных:", e);
      }
      renderTasks();
      updateMainButton();
    }

    function formatPrice(num) {
      if (!num || num <= 0) return "—";
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽";
    }

    function renderTasks() {
      const container = document.getElementById("taskList");
      container.innerHTML = "";

      tasks.forEach((t) => {
        const card = document.createElement("div");
        card.className = "task-card";
        card.innerHTML = `
          <div class="task-top">
            <div>
              <div class="task-name">${t.title || "Без названия"}</div>
              <a href="${t.url}" target="_blank" class="task-url-tag">🔗 ${t.url || "Ссылка не указана"}</a>
            </div>
            <div class="task-actions">
              <button class="icon-btn" onclick="openEdit('${t.id}')">✏️</button>
              <button class="icon-btn" style="color: var(--danger)" onclick="deleteTask('${t.id}')">🗑</button>
            </div>
          </div>

          <div class="task-meta">
            <div class="meta-box">
              <p>Диапазон цен</p>
              <p>${formatPrice(t.min_price)} — ${formatPrice(t.max_price)}</p>
            </div>
            <div class="meta-box">
              <p>Средний рынок</p>
              <p class="market-pill">${t.avg_price ? "~" + formatPrice(t.avg_price) : "Расчет..."}</p>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateMainButton() {
      if (!tg || !tg.MainButton) return;
      tg.MainButton.text = "СОХРАНИТЬ И ПРИМЕНИТЬ";
      tg.MainButton.color = "#2ea043";
      tg.MainButton.textColor = "#ffffff";
      tg.MainButton.show();
    }

    if (tg && tg.MainButton) {
      tg.MainButton.onClick(() => {
        tg.sendData(JSON.stringify(tasks));
      });
    }

    const modal = document.getElementById("modal");
    const btnOpenAdd = document.getElementById("btnOpenAdd");
    const btnCancel = document.getElementById("btnCancel");
    const btnSave = document.getElementById("btnSave");

    btnOpenAdd.addEventListener("click", () => {
      editTaskId = null;
      document.getElementById("modalTitle").innerText = "Новый поиск";
      document.getElementById("inputTitle").value = "";
      document.getElementById("inputUrl").value = "";
      document.getElementById("inputMin").value = "5000";
      document.getElementById("inputMax").value = "120000";
      modal.classList.add("active");
    });

    btnCancel.addEventListener("click", () => {
      modal.classList.remove("active");
    });

    window.openEdit = function(id) {
      const task = tasks.find(x => String(x.id) === String(id));
      if (!task) return;
      editTaskId = id;
      document.getElementById("modalTitle").innerText = "Редактирование";
      document.getElementById("inputTitle").value = task.title || "";
      document.getElementById("inputUrl").value = task.url || "";
      document.getElementById("inputMin").value = task.min_price || 5000;
      document.getElementById("inputMax").value = task.max_price || 120000;
      modal.classList.add("active");
    };

    window.deleteTask = function(id) {
      tasks = tasks.filter(x => String(x.id) !== String(id));
      renderTasks();
    };

    btnSave.addEventListener("click", () => {
      const title = document.getElementById("inputTitle").value.trim();
      let url = document.getElementById("inputUrl").value.trim();
      const minP = parseInt(document.getElementById("inputMin").value) || 0;
      const maxP = parseInt(document.getElementById("inputMax").value) || 200000;

      if (!title || !url) {
        alert("Заполните название и ссылку");
        return;
      }

      const cleanUrl = url.split("?")[0] + "?s=104";

      if (editTaskId) {
        const item = tasks.find(x => String(x.id) === String(editTaskId));
        if (item) {
          item.title = title;
          item.url = cleanUrl;
          item.min_price = minP;
          item.max_price = maxP;
        }
      } else {
        tasks.push({
          id: String(Date.now()),
          title: title,
          url: cleanUrl,
          min_price: minP,
          max_price: maxP,
          avg_price: 0
        });
      }

      modal.classList.remove("active");
      renderTasks();
    });

    initData();
  </script>
</body>
</html>
