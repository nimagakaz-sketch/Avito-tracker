<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Управление поисками</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0d11;
      --card-bg: rgba(26, 29, 36, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f7;
      --hint: #86868b;
      --accent: #2997ff;
      --green: #30d158;
      --green-bg: rgba(48, 209, 88, 0.15);
      --chip-bg: rgba(255, 255, 255, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px 16px 110px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      padding: 8px 4px 18px 4px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }
    .header p {
      font-size: 13px;
      color: var(--hint);
      margin-top: 4px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .card-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
      position: relative;
    }
    .live-dot::after {
      content: "";
      position: absolute;
      top: -3px; left: -3px;
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 1px solid var(--green);
      animation: pulse 2s infinite ease-out;
      opacity: 0;
    }
    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .task-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .chevron {
      color: var(--hint);
      font-size: 15px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card.expanded .chevron {
      transform: rotate(180deg);
    }

    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 16px 14px 16px;
    }
    .badge {
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 12px;
      background: var(--chip-bg);
      color: var(--hint);
    }
    .badge.price {
      background: var(--green-bg);
      color: var(--green);
      font-weight: 600;
    }

    .card-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      border-top: 1px solid transparent;
      padding: 0 16px;
    }
    .card.expanded .card-body {
      max-height: 600px;
      border-top-color: var(--card-border);
      padding: 16px 16px 20px 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--hint);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    .input-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      color: var(--text);
      outline: none;
      font-family: inherit;
    }
    .input-box:focus {
      border-color: var(--accent);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }
    .toggle-label {
      font-size: 15px;
      font-weight: 500;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 28px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: 0.25s ease;
      border-radius: 28px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.25s ease;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--green);
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .btn-secondary {
      flex: 1;
      background: var(--chip-bg);
      border: none;
      color: var(--text);
      padding: 11px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-danger {
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: none;
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
      background: rgba(11, 13, 17, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--card-border);
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    .btn-primary {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-add {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      width: 48px;
      height: 48px;
      border-radius: 14px;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Активные поиски</h1>
    <p>Мониторинг предложений в реальном времени</p>
  </div>

  <div class="task-list" id="taskList"></div>

  <div class="bottom-bar">
    <button class="btn-add" id="addBtn">＋</button>
    <button class="btn-primary" id="saveBtn">💾 Сохранить и применить</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'success' || type === 'warning' || type === 'error') {
          tg.HapticFeedback.notificationOccurred(type);
        } else {
          tg.HapticFeedback.impactOccurred(type);
        }
      }
    }

    // Безопасное декодирование UTF-8 Base64
    function safeB64Decode(str) {
      try {
        const binString = atob(str);
        const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
        return JSON.parse(new TextDecoder().decode(bytes));
      } catch (e) {
        console.warn('UTF-8 decode fallback to standard escape/unescape', e);
        return JSON.parse(decodeURIComponent(escape(atob(str))));
      }
    }

    let tasks = [];
    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('data');

    if (dataParam) {
      try {
        tasks = safeB64Decode(dataParam);
        localStorage.setItem('cached_avito_tasks', JSON.stringify(tasks));
      } catch (e) {
        console.error('Ошибка разбора данных из URL:', e);
      }
    }

    // Если параметров не было, читаем сохранённое в кэше
    if (!tasks || tasks.length === 0) {
      try {
        const local = localStorage.getItem('cached_avito_tasks');
        if (local) tasks = JSON.parse(local);
      } catch (e) {}
    }

    // Запасной дефолтный список, если открыто в первый раз абсолютно чисто
    if (!tasks || tasks.length === 0) {
      tasks = [
        {
          id: "1",
          title: "iPhone 13",
          url: "https://m.avito.ru/kemerovo/telefony/mobilnye_telefony/apple/iphone_13-ASgBAgICA0SywA3svcgBtMANzqs5sMENiPw3?context=H4sIAAAAAAAA_wG5AEb_YTo1OntzOjk6ImZyb21fcGFnZSI7czo3OiJmaWx0ZXJzIjtzOjE0OiJoYXNFeHRyYVBhcmFtcyI7YjoxO3M6Njoic291cmNlIjtzOjc6Imhpc3RvcnkiO3M6MTI6InNvdXJjZV9xdWVyeSI7czo5OiJpcGhvbmUgMTMiO3M6NToieF9zZ3QiO3M6NDA6ImU0YTVmZTMzMTJiYzhhMTg0NjBmNjY5Y2U3MTU2MzFmOTg5NjYwNDIiO31F5ED5uQAAAA&geoCoords=55.354968%2C86.087314&presentationType=serp&radius=0&s=104",
          min_price: 20000,
          max_price: 75000,
          private_only: false,
          avg_price: 28884
        },
        {
          id: "2",
          title: "iPhone 15 Кемерово",
          url: "https://m.avito.ru/kemerovo/telefony/mobilnye_telefony/apple/iphone_15-ASgBAgICA0SywA2SoO0RtMANzqs5sMENiPw3?context=H4sIAAAAAAAA_wGgAF__YTo0OntzOjk6ImZyb21fcGFnZSI7czo3OiJmaWx0ZXJzIjtzOjE0OiJoYXNFeHRyYVBhcmFtcyI7YjoxO3M6Njoic291cmNlIjtzOjc6Imhpc3RvcnkiO3M6MTI6InNvdXJjZV9xdWVyeSI7czo5OiJpcGhvbmUgMTUiO31U1mOzuAAAAA&geoCoords=55.354968%2C86.087314&presentationType=serp&radius=0&s=104",
          min_price: 35000,
          max_price: 90000,
          private_only: false,
          avg_price: 42768
        }
      ];
    }

    const taskListEl = document.getElementById('taskList');

    function renderTasks() {
      taskListEl.innerHTML = '';
      tasks.forEach((t, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${index}`;

        const avgPrice = t.avg_price ? `~${Number(t.avg_price).toLocaleString('ru-RU')} ₽` : 'расчет...';
        const sellerBadge = t.private_only ? '👤 Только частники' : '🏢 Все';

        card.innerHTML = `
          <div class="card-header" onclick="toggleExpand(${index})">
            <div class="title-area">
              <span class="live-dot"></span>
              <span class="task-title">${t.title || 'Поиск'}</span>
            </div>
            <span class="chevron">▼</span>
          </div>

          <div class="badges-row">
            <span class="badge price">📊 ${avgPrice}</span>
            <span class="badge">💰 ${Number(t.min_price || 0).toLocaleString('ru-RU')} – ${Number(t.max_price || 0).toLocaleString('ru-RU')} ₽</span>
            <span class="badge">${sellerBadge}</span>
          </div>

          <div class="card-body">
            <div class="form-group">
              <label>Название</label>
              <input class="input-box" type="text" value="${t.title || ''}" oninput="updateField(${index}, 'title', this.value)">
            </div>

            <div class="form-group">
              <label>Диапазон цены (₽)</label>
              <div class="input-row">
                <input class="input-box" type="number" placeholder="От" value="${t.min_price || ''}" oninput="updateField(${index}, 'min_price', Number(this.value))">
                <input class="input-box" type="number" placeholder="До" value="${t.max_price || ''}" oninput="updateField(${index}, 'max_price', Number(this.value))">
              </div>
            </div>

            <div class="form-group">
              <label>Ссылка на поиск Авито</label>
              <input class="input-box" type="text" value="${t.url || ''}" oninput="updateField(${index}, 'url', this.value)">
            </div>

            <div class="toggle-row">
              <span class="toggle-label">Только частные продавцы</span>
              <label class="switch">
                <input type="checkbox" ${t.private_only ? 'checked' : ''} onchange="togglePrivate(${index}, this.checked)">
                <span class="slider"></span>
              </label>
            </div>

            <div class="actions">
              <button class="btn-danger" onclick="deleteTask(${index})">Удалить</button>
              <button class="btn-secondary" onclick="toggleExpand(${index})">Готово</button>
            </div>
          </div>
        `;
        taskListEl.appendChild(card);
      });
    }

    function toggleExpand(index) {
      haptic('light');
      document.getElementById(`card-${index}`)?.classList.toggle('expanded');
    }

    function updateField(index, field, value) {
      tasks[index][field] = value;
      localStorage.setItem('cached_avito_tasks', JSON.stringify(tasks));
    }

    function togglePrivate(index, value) {
      haptic('light');
      tasks[index].private_only = value;
      localStorage.setItem('cached_avito_tasks', JSON.stringify(tasks));
      renderTasks();
      document.getElementById(`card-${index}`)?.classList.add('expanded');
    }

    function deleteTask(index) {
      haptic('warning');
      tasks.splice(index, 1);
      localStorage.setItem('cached_avito_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    document.getElementById('addBtn').addEventListener('click', () => {
      haptic('light');
      tasks.push({
        id: Date.now().toString(),
        title: 'Новый iPhone',
        url: '',
        min_price: 20000,
        max_price: 80000,
        private_only: false,
        avg_price: 0
      });
      localStorage.setItem('cached_avito_tasks', JSON.stringify(tasks));
      renderTasks();
      const lastIndex = tasks.length - 1;
      setTimeout(() => {
        document.getElementById(`card-${lastIndex}`)?.classList.add('expanded');
      }, 50);
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      haptic('success');
      localStorage.setItem('cached_avito_tasks', JSON.stringify(tasks));
      if (tg) {
        tg.sendData(JSON.stringify(tasks));
      } else {
        alert('Данные сохранены!');
      }
    });

    renderTasks();
  </script>
</body>
</html>
