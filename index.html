<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Avito Radar</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-active-border: rgba(56, 139, 253, 0.35);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #2f81f7;
      --accent-gradient: linear-gradient(135deg, #2f81f7 0%, #1f6feb 100%);
      --danger: #f85149;
      --danger-bg: rgba(248, 81, 73, 0.12);
      --warning: #d29922;
      --warning-bg: rgba(210, 153, 34, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px 16px 85px 16px;
      font-size: 14.5px;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 0%, rgba(47, 129, 247, 0.12) 0%, transparent 60%);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 4px;
    }

    .app-title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 20px;
      background: rgba(35, 134, 54, 0.15);
      border: 1px solid rgba(35, 134, 54, 0.3);
      font-size: 11.5px;
      font-weight: 600;
      color: #3fb950;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3fb950;
      box-shadow: 0 0 8px #3fb950;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .chips-row::-webkit-scrollbar { display: none; }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12.5px;
      white-space: nowrap;
      cursor: pointer;
      color: var(--text-muted);
    }

    .chip:active {
      transform: scale(0.95);
      background: rgba(47, 129, 247, 0.2);
      color: var(--text-main);
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="text"], input[type="url"], input[type="number"] {
      width: 100%;
      background: rgba(13, 17, 23, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text-main);
      font-size: 14.5px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.15);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 4px 0;
      cursor: pointer;
    }

    .toggle-label {
      font-size: 13.5px;
      font-weight: 500;
    }

    .toggle-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 26px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 34px;
      transition: 0.3s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.3s;
    }

    input:checked + .slider { background-color: #3fb950; }
    input:checked + .slider:before { transform: translateX(18px); }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .submit-btn {
      flex: 1;
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      border-radius: 11px;
      padding: 12px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .cancel-btn {
      display: none;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: 11px;
      padding: 12px 16px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-btn:active, .cancel-btn:active {
      transform: scale(0.98);
    }

    .task-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .task-card:last-child { margin-bottom: 0; }

    .task-main {
      flex: 1;
      padding-right: 10px;
    }

    .task-name {
      font-size: 14.5px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .task-details {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
    }

    .pill-price { background: rgba(47, 129, 247, 0.12); color: #58a6ff; }
    .pill-market { background: rgba(35, 134, 54, 0.15); color: #3fb950; }
    .pill-private { background: rgba(163, 113, 247, 0.15); color: #bc8cff; }

    .actions-box {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      font-size: 14px;
    }

    .edit-btn {
      background: var(--warning-bg);
      border-color: rgba(210, 153, 34, 0.3);
      color: var(--warning);
    }

    .delete-btn {
      background: var(--danger-bg);
      border-color: rgba(248, 81, 73, 0.2);
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 24px 10px;
      color: var(--text-muted);
      font-size: 13.5px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="app-title">Avito Radar</div>
    <div class="status-badge">
      <span class="pulse-dot"></span>
      <span>Слежка активна</span>
    </div>
  </div>

  <div class="chips-row">
    <div class="chip" onclick="applyPreset('iPhone 15')">📱 iPhone 15</div>
    <div class="chip" onclick="applyPreset('iPhone 14 Pro')">📱 iPhone 14 Pro</div>
    <div class="chip" onclick="applyPreset('iPhone 13')">📱 iPhone 13</div>
    <div class="chip" onclick="applyPreset('AirPods Pro 2')">🎧 AirPods Pro 2</div>
  </div>

  <div class="glass-card">
    <div class="section-title">
      <span id="formTitle">Новый трекинг</span>
    </div>
    
    <input type="hidden" id="editingTaskId" value="">

    <div class="field">
      <label>НАЗВАНИЕ МОДЕЛИ</label>
      <input type="text" id="titleInput" placeholder="Например: iPhone 15 128GB">
    </div>

    <div class="field">
      <label>ССЫЛКА НА M.AVITO.RU</label>
      <input type="url" id="urlInput" placeholder="https://m.avito.ru/...">
    </div>

    <div class="grid-2">
      <div class="field">
        <label>МИН. ЦЕНА (₽)</label>
        <input type="number" id="minPriceInput" placeholder="25 000">
      </div>
      <div class="field">
        <label>МАКС. ЦЕНА (₽)</label>
        <input type="number" id="maxPriceInput" placeholder="180 000">
      </div>
    </div>

    <div class="toggle-row" onclick="togglePrivate()">
      <div>
        <div class="toggle-label">Только частники</div>
        <div class="toggle-sub">Исключать магазины и скупки</div>
      </div>
      <label class="switch" onclick="event.stopPropagation()">
        <input type="checkbox" id="privateOnlyInput" onchange="haptic()">
        <span class="slider"></span>
      </label>
    </div>

    <div class="btn-row">
      <button class="submit-btn" id="submitBtn" onclick="saveTaskForm()">Добавить в радар</button>
      <button class="cancel-btn" id="cancelBtn" onclick="resetForm()">Отмена</button>
    </div>
  </div>

  <div class="section-title" style="padding: 0 4px;">Отслеживаемые категории (<span id="taskCount">0</span>)</div>
  <div class="glass-card" id="tasksList" style="padding: 10px;"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function haptic(type = 'light') {
      if (tg.HapticFeedback) {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred(type);
      }
    }

    let tasks = [];
    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('data');

    if (dataParam) {
      try {
        tasks = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
        localStorage.setItem("avito_tasks", JSON.stringify(tasks));
      } catch (e) {
        console.error("Ошибка парсинга:", e);
      }
    }

    if (!tasks || tasks.length === 0) {
      tasks = JSON.parse(localStorage.getItem("avito_tasks")) || [];
    }

    function applyPreset(name) {
      haptic('light');
      document.getElementById('titleInput').value = `${name} Кемерово`;
    }

    function togglePrivate() {
      const el = document.getElementById("privateOnlyInput");
      el.checked = !el.checked;
      haptic('light');
    }

    function renderTasks() {
      const container = document.getElementById("tasksList");
      const countEl = document.getElementById("taskCount");
      countEl.innerText = tasks.length;
      container.innerHTML = "";

      if (tasks.length === 0) {
        container.innerHTML = '<div class="empty-state">Нет активных отслеживаний.<br>Добавьте первый поиск выше.</div>';
        tg.MainButton.hide();
        return;
      }

      tasks.forEach((t) => {
        const item = document.createElement("div");
        item.className = "task-card";
        
        let badgesHtml = `<span class="pill pill-price">${t.min_price?.toLocaleString('ru-RU')} – ${t.max_price?.toLocaleString('ru-RU')} ₽</span>`;
        if (t.avg_price && t.avg_price > 0) {
          badgesHtml += `<span class="pill pill-market">~${t.avg_price.toLocaleString('ru-RU')} ₽</span>`;
        }
        if (t.private_only) {
          badgesHtml += `<span class="pill pill-private">👤 Частники</span>`;
        }

        item.innerHTML = `
          <div class="task-main">
            <div class="task-name">${t.title}</div>
            <div class="task-details">${badgesHtml}</div>
          </div>
          <div class="actions-box">
            <button class="icon-btn edit-btn" onclick="startEdit(${t.id})">✏️</button>
            <button class="icon-btn delete-btn" onclick="removeTask(${t.id})">✕</button>
          </div>
        `;
        container.appendChild(item);
      });

      tg.MainButton.text = "💾 Сохранить и применить";
      tg.MainButton.textColor = "#ffffff";
      tg.MainButton.color = "#2f81f7";
      tg.MainButton.show();
    }

    function startEdit(id) {
      haptic('medium');
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      document.getElementById('editingTaskId').value = task.id;
      document.getElementById('titleInput').value = task.title;
      document.getElementById('urlInput').value = task.url;
      document.getElementById('minPriceInput').value = task.min_price;
      document.getElementById('maxPriceInput').value = task.max_price;
      document.getElementById('privateOnlyInput').checked = !!task.private_only;

      document.getElementById('formTitle').innerText = 'Редактирование задачи';
      document.getElementById('submitBtn').innerText = 'Обновить параметры';
      document.getElementById('cancelBtn').style.display = 'block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editingTaskId').value = '';
      document.getElementById('titleInput').value = '';
      document.getElementById('urlInput').value = '';
      document.getElementById('minPriceInput').value = '';
      document.getElementById('maxPriceInput').value = '';
      document.getElementById('privateOnlyInput').checked = false;

      document.getElementById('formTitle').innerText = 'Новый трекинг';
      document.getElementById('submitBtn').innerText = 'Добавить в радар';
      document.getElementById('cancelBtn').style.display = 'none';
      haptic('light');
    }

    function saveTaskForm() {
      const editId = document.getElementById('editingTaskId').value;
      const title = document.getElementById('titleInput').value.trim();
      const url = document.getElementById('urlInput').value.trim();
      const min_p = parseInt(document.getElementById('minPriceInput').value) || 10000;
      const max_p = parseInt(document.getElementById('maxPriceInput').value) || 250000;
      const private_only = document.getElementById('privateOnlyInput').checked;

      if (!title || !url) {
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        tg.showAlert("Укажите название и ссылку!");
        return;
      }

      if (editId) {
        tasks = tasks.map(t => {
          if (String(t.id) === String(editId)) {
            return {
              ...t,
              title: title,
              url: url,
              min_price: min_p,
              max_price: max_p,
              private_only: private_only
            };
          }
          return t;
        });
        haptic('success');
      } else {
        const newTask = {
          id: Date.now(),
          title: title,
          url: url,
          min_price: min_p,
          max_price: max_p,
          private_only: private_only,
          avg_price: 0
        };
        tasks.unshift(newTask);
        haptic('medium');
      }

      localStorage.setItem("avito_tasks", JSON.stringify(tasks));
      resetForm();
      renderTasks();
    }

    function removeTask(id) {
      haptic('heavy');
      tasks = tasks.filter(t => t.id !== id);
      localStorage.setItem("avito_tasks", JSON.stringify(tasks));
      if (document.getElementById('editingTaskId').value === String(id)) {
        resetForm();
      }
      renderTasks();
    }

    tg.onEvent("mainButtonClicked", function() {
      haptic('success');
      tg.sendData(JSON.stringify(tasks));
      tg.close();
    });

    renderTasks();
  </script>
</body>
</html>
