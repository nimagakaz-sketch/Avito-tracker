<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Управление мониторингом</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #17212b);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #232e3c);
      --text-color: var(--tg-theme-text-color, #f5f5f5);
      --hint-color: var(--tg-theme-hint-color, #708499);
      --button-color: var(--tg-theme-button-color, #5288c1);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --danger-color: #e53935;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-color: #2ea043;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      font-size: 15px;
    }

    h2 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .card {
      background: var(--secondary-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--hint-color);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], input[type="url"], input[type="number"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-color);
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--button-color);
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .input-group {
      flex: 1;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .checkbox-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--button-color);
    }

    .checkbox-row span {
      font-size: 13.5px;
    }

    .btn {
      width: 100%;
      background: var(--button-color);
      color: var(--button-text);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--card-border);
    }

    .task-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .task-info {
      flex: 1;
      padding-right: 12px;
    }

    .task-title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 3px;
    }

    .task-meta {
      font-size: 12.5px;
      color: var(--hint-color);
      line-height: 1.4;
    }

    .task-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(82, 136, 193, 0.2);
      color: var(--button-color);
      margin-top: 4px;
    }

    .del-btn {
      background: transparent;
      border: none;
      color: var(--danger-color);
      padding: 8px;
      cursor: pointer;
      font-size: 18px;
    }

    .empty-msg {
      text-align: center;
      color: var(--hint-color);
      padding: 20px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h2>➕ Добавить отслеживание</h2>
  <div class="card">
    <div class="input-group">
      <label>Название товара / запроса</label>
      <input type="text" id="titleInput" placeholder="Например: iPhone 15 Кемерово">
    </div>
    <div class="input-group">
      <label>Ссылка на мобильный поиск Авито (m.avito.ru)</label>
      <input type="url" id="urlInput" placeholder="https://m.avito.ru/...">
    </div>
    <div class="row">
      <div class="input-group">
        <label>Мин. цена (₽)</label>
        <input type="number" id="minPriceInput" placeholder="25000">
      </div>
      <div class="input-group">
        <label>Макс. цена (₽)</label>
        <input type="number" id="maxPriceInput" placeholder="180000">
      </div>
    </div>
    <label class="checkbox-row">
      <input type="checkbox" id="privateOnlyInput">
      <span>Исключать магазины (только частники)</span>
    </label>
    <button class="btn" onclick="addTask()">Добавить в список</button>
  </div>

  <h2>📋 Активные поиски</h2>
  <div class="card" id="tasksList"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let tasks = [];
    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('data');

    if (dataParam) {
      try {
        tasks = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
        localStorage.setItem("avito_tasks", JSON.stringify(tasks));
      } catch (e) {
        console.error("Ошибка парсинга:", e);
      }
    }

    if (!tasks || tasks.length === 0) {
      tasks = JSON.parse(localStorage.getItem("avito_tasks")) || [];
    }

    function renderTasks() {
      const container = document.getElementById("tasksList");
      container.innerHTML = "";

      if (tasks.length === 0) {
        container.innerHTML = '<div class="empty-msg">Список отслеживания пуст</div>';
        return;
      }

      tasks.forEach((t) => {
        const item = document.createElement("div");
        item.className = "task-item";
        const avgText = t.avg_price ? ` • Рынок: ~${t.avg_price.toLocaleString('ru-RU')} ₽` : '';
        item.innerHTML = `
          <div class="task-info">
            <div class="task-title">${t.title}</div>
            <div class="task-meta">
              ${t.min_price?.toLocaleString('ru-RU')} – ${t.max_price?.toLocaleString('ru-RU')} ₽${avgText}
            </div>
            ${t.private_only ? '<span class="task-badge">Только частники</span>' : ''}
          </div>
          <button class="del-btn" onclick="removeTask(${t.id})">✕</button>
        `;
        container.appendChild(item);
      });

      tg.MainButton.text = "💾 Сохранить и применить в боте";
      tg.MainButton.show();
    }

    function addTask() {
      const title = document.getElementById("titleInput").value.trim();
      const url = document.getElementById("urlInput").value.trim();
      const min_p = parseInt(document.getElementById("minPriceInput").value) || 10000;
      const max_p = parseInt(document.getElementById("maxPriceInput").value) || 250000;
      const private_only = document.getElementById("privateOnlyInput").checked;

      if (!title || !url) {
        tg.showAlert("Заполните название и ссылку!");
        return;
      }

      const newTask = {
        id: Date.now(),
        title: title,
        url: url,
        min_price: min_p,
        max_price: max_p,
        private_only: private_only,
        avg_price: 0
      };

      tasks.push(newTask);
      localStorage.setItem("avito_tasks", JSON.stringify(tasks));

      document.getElementById("titleInput").value = "";
      document.getElementById("urlInput").value = "";
      document.getElementById("privateOnlyInput").checked = false;
      renderTasks();
    }

    function removeTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      localStorage.setItem("avito_tasks", JSON.stringify(tasks));
      renderTasks();
    }

    tg.onEvent("mainButtonClicked", function() {
      tg.sendData(JSON.stringify(tasks));
      tg.close();
    });

    renderTasks();
  </script>
</body>
</html>
