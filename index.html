<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Avito Tracker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #2ea043;
      --accent-glow: rgba(46, 160, 67, 0.35);
      --danger: #f85149;
      --danger-glow: rgba(248, 81, 73, 0.25);
      --blue: #388bfd;
      --blue-glow: rgba(56, 139, 253, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px 16px 100px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .pulse-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid rgba(46, 160, 67, 0.3);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #3fb950;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: #3fb950;
      border-radius: 50%;
      box-shadow: 0 0 8px #3fb950;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s;
      position: relative;
    }

    .task-card:active {
      transform: scale(0.985);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .task-name {
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.3;
    }

    .task-url-tag {
      font-size: 11px;
      color: var(--blue);
      background: var(--blue-glow);
      padding: 3px 8px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      margin-top: 4px;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover, .icon-btn:active {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .icon-btn.delete:active {
      background: var(--danger-glow);
      color: var(--danger);
      border-color: var(--danger);
    }

    .task-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .meta-box p:first-child {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .meta-box p:last-child {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-top: 2px;
    }

    .market-pill {
      color: #388bfd !important;
    }

    .add-task-btn {
      width: 100%;
      padding: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px dashed rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 14px;
      transition: all 0.2s;
    }

    .add-task-btn:active {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--text);
      color: #ffffff;
      transform: scale(0.985);
    }

    /* Modal Sheet */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background: #161b22;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px 24px 0 0;
      width: 100%;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.active .modal-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin: -10px auto 16px;
    }

    .sheet-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 14px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 15px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--blue);
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }

    .toggle-label {
      font-size: 15px;
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 28px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .3s;
      border-radius: 28px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .sheet-btns {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 12px;
      margin-top: 18px;
    }

    .btn-secondary {
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: #238636;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: #2ea043;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>Мониторинг</h1>
      <p>Активные поиски Avito</p>
    </div>
    <div class="pulse-badge">
      <div class="pulse-dot"></div>
      Онлайн
    </div>
  </header>

  <div class="task-list" id="taskList"></div>

  <button class="add-task-btn" id="btnOpenAdd">
    <span>➕</span> Добавить модель для отслеживания
  </button>

  <!-- Modal Sheet -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="modalTitle">Настройка поиска</div>

      <div class="form-group">
        <label>Название модели</label>
        <input type="text" id="inputTitle" class="form-input" placeholder="Например: iPhone 15 Pro">
      </div>

      <div class="form-group">
        <label>Ссылка поиска на Авито</label>
        <input type="text" id="inputUrl" class="form-input" placeholder="https://m.avito.ru/kemerovo/telefony/...">
      </div>

      <div class="input-row">
        <div class="form-group">
          <label>Мин. цена (₽)</label>
          <input type="number" id="inputMin" class="form-input" placeholder="10000">
        </div>
        <div class="form-group">
          <label>Макс. цена (₽)</label>
          <input type="number" id="inputMax" class="form-input" placeholder="120000">
        </div>
      </div>

      <div class="toggle-row">
        <span class="toggle-label">Только частники</span>
        <label class="switch">
          <input type="checkbox" id="inputPrivate">
          <span class="slider"></span>
        </label>
      </div>

      <div class="sheet-btns">
        <button class="btn-secondary" id="btnCancel">Отмена</button>
        <button class="btn-primary" id="btnSave">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.enableClosingConfirmation();
    }

    let tasks = [];
    let editTaskId = null;

    function haptic(type = "light") {
      try {
        if (tg && tg.HapticFeedback) {
          if (type === "success") tg.HapticFeedback.notificationOccurred("success");
          else if (type === "warning") tg.HapticFeedback.notificationOccurred("warning");
          else tg.HapticFeedback.impactOccurred(type);
        }
      } catch (e) {}
    }

    function initData() {
      const params = new URLSearchParams(window.location.search);
      const encoded = params.get("data");
      if (encoded) {
        try {
          const jsonStr = decodeURIComponent(escape(atob(encoded)));
          tasks = JSON.parse(jsonStr);
        } catch (e) {
          console.error("Decode error", e);
        }
      }
      renderTasks();
      updateMainButton();
    }

    function formatPrice(num) {
      if (!num || num <= 0) return "—";
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽";
    }

    function renderTasks() {
      const container = document.getElementById("taskList");
      container.innerHTML = "";

      if (tasks.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px 10px; color: var(--text-muted);">
            <div style="font-size: 38px; margin-bottom: 12px;">📱</div>
            <div style="font-size: 16px; font-weight: 600; color: #fff;">Нет активных поисков</div>
            <div style="font-size: 13px; margin-top: 4px;">Добавьте первую модель, чтобы бот начал пересылать новые объявления.</div>
          </div>
        `;
        return;
      }

      tasks.forEach((t) => {
        const card = document.createElement("div");
        card.className = "task-card";
        card.innerHTML = `
          <div class="task-top">
            <div>
              <div class="task-name">${t.title || "Без названия"}</div>
              <a href="${t.url}" target="_blank" class="task-url-tag">🔗 ${t.url || "Ссылка не указана"}</a>
            </div>
            <div class="task-actions">
              <button class="icon-btn" onclick="openEdit('${t.id}')">✏️</button>
              <button class="icon-btn delete" onclick="deleteTask('${t.id}')">🗑</button>
            </div>
          </div>

          <div class="task-meta">
            <div class="meta-box">
              <p>Диапазон цен</p>
              <p>${formatPrice(t.min_price)} — ${formatPrice(t.max_price)}</p>
            </div>
            <div class="meta-box">
              <p>Средний рынок</p>
              <p class="market-pill">${t.avg_price ? "~" + formatPrice(t.avg_price) : "Расчет..."}</p>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateMainButton() {
      if (!tg || !tg.MainButton) return;
      tg.MainButton.text = "СОХРАНИТЬ И ПРИМЕНИТЬ";
      tg.MainButton.color = "#2ea043";
      tg.MainButton.textColor = "#ffffff";
      tg.MainButton.show();
    }

    if (tg && tg.MainButton) {
      tg.MainButton.onClick(() => {
        haptic("success");
        tg.sendData(JSON.stringify(tasks));
      });
    }

    // Modal
    const modal = document.getElementById("modal");
    const btnOpenAdd = document.getElementById("btnOpenAdd");
    const btnCancel = document.getElementById("btnCancel");
    const btnSave = document.getElementById("btnSave");

    btnOpenAdd.addEventListener("click", () => {
      haptic("light");
      editTaskId = null;
      document.getElementById("modalTitle").innerText = "Новый поиск";
      document.getElementById("inputTitle").value = "";
      document.getElementById("inputUrl").value = "";
      document.getElementById("inputMin").value = "5000";
      document.getElementById("inputMax").value = "120000";
      document.getElementById("inputPrivate").checked = false;
      modal.classList.add("active");
    });

    btnCancel.addEventListener("click", () => {
      haptic("light");
      modal.classList.remove("active");
    });

    window.openEdit = function(id) {
      haptic("light");
      const task = tasks.find(x => String(x.id) === String(id));
      if (!task) return;
      editTaskId = id;
      document.getElementById("modalTitle").innerText = "Редактирование";
      document.getElementById("inputTitle").value = task.title || "";
      document.getElementById("inputUrl").value = task.url || "";
      document.getElementById("inputMin").value = task.min_price || 5000;
      document.getElementById("inputMax").value = task.max_price || 120000;
      document.getElementById("inputPrivate").checked = !!task.private_only;
      modal.classList.add("active");
    };

    window.deleteTask = function(id) {
      haptic("warning");
      tasks = tasks.filter(x => String(x.id) !== String(id));
      renderTasks();
    };

    btnSave.addEventListener("click", () => {
      const title = document.getElementById("inputTitle").value.trim();
      let url = document.getElementById("inputUrl").value.trim();
      const minP = parseInt(document.getElementById("inputMin").value) || 0;
      const maxP = parseInt(document.getElementById("inputMax").value) || 200000;
      const priv = document.getElementById("inputPrivate").checked;

      if (!title || !url) {
        haptic("warning");
        alert("Заполните название и ссылку");
        return;
      }

      // Чистим ссылку от мусорных параметров context/geoCoords
      const cleanUrl = url.split("?")[0] + "?s=104";

      haptic("light");
      if (editTaskId) {
        const item = tasks.find(x => String(x.id) === String(editTaskId));
        if (item) {
          item.title = title;
          item.url = cleanUrl;
          item.min_price = minP;
          item.max_price = maxP;
          item.private_only = priv;
        }
      } else {
        tasks.push({
          id: String(Date.now()),
          title: title,
          url: cleanUrl,
          min_price: minP,
          max_price: maxP,
          private_only: priv,
          avg_price: 0
        });
      }

      modal.classList.remove("active");
      renderTasks();
    });

    initData();
  </script>
</body>
</html>
