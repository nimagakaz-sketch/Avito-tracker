<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Avito Tracker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #2ea043;
      --accent-glow: rgba(46, 160, 67, 0.35);
      --danger: #f85149;
      --blue: #388bfd;
      --blue-glow: rgba(56, 139, 253, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px 16px 100px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .pulse-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid rgba(46, 160, 67, 0.3);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #3fb950;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: #3fb950;
      border-radius: 50%;
      box-shadow: 0 0 8px #3fb950;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.2s ease-in-out;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-card, .deal-card, .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .task-name {
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.3;
    }

    .task-city-tag {
      font-size: 11px;
      color: var(--blue);
      background: var(--blue-glow);
      padding: 3px 8px;
      border-radius: 8px;
      display: inline-block;
      margin-top: 4px;
      font-weight: 600;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }

    .task-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .meta-box p:first-child {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .meta-box p:last-child {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-top: 2px;
    }

    .market-pill { color: #388bfd !important; }
    .profit-pill { color: #3fb950 !important; }

    .add-task-btn {
      width: 100%;
      padding: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px dashed rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 6px;
      margin-bottom: 14px;
    }

    .save-settings-btn {
      width: 100%;
      padding: 16px;
      background: #2ea043;
      border: none;
      border-radius: 16px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .deal-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(46, 160, 67, 0.15);
      color: #3fb950;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .deal-price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .deal-price {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
    }

    .deal-market {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-avito {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #388bfd;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(65px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(13, 17, 23, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 900;
    }

    .tab-btn {
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .tab-btn.active { color: #388bfd; }
    .tab-icon { font-size: 19px; }
    .tab-label { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }

    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-sheet {
      background: #161b22;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px 24px 0 0;
      width: 100%;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-backdrop.active .modal-sheet { transform: translateY(0); }

    .sheet-handle {
      width: 40px; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; margin: -10px auto 16px;
    }

    .sheet-title { font-size: 19px; font-weight: 700; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; position: relative; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .form-input, .form-select {
      width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--card-border); border-radius: 12px; font-size: 15px; color: #fff; outline: none;
    }
    .form-select option { background: #161b22; color: #fff; }

    .city-suggestions {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #1c2128; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; max-height: 180px; overflow-y: auto; z-index: 1050; display: none;
    }
    .city-item { padding: 12px 14px; font-size: 14px; color: #e6edf3; border-bottom: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; }
    .city-item:last-child { border-bottom: none; }
    .city-item:hover { background: rgba(56, 139, 253, 0.2); }

    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .sheet-btns { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; margin-top: 18px; }
    .btn-secondary { padding: 14px; border-radius: 14px; border: 1px solid var(--card-border); background: rgba(255, 255, 255, 0.05); color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary { padding: 14px; border-radius: 14px; border: none; background: #238636; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Вкладка 1: Поиски -->
  <div id="tab-tasks" class="tab-content active">
    <header>
      <div class="header-title">
        <h1>Avito Tracker</h1>
        <p id="subTitle">Загрузка задач...</p>
      </div>
      <div class="pulse-badge">
        <div class="pulse-dot"></div>
        Онлайн
      </div>
    </header>

    <div class="task-list" id="taskList"></div>

    <button class="add-task-btn" id="btnOpenAdd">
      <span>➕</span> Добавить телефон и город
    </button>

    <button class="save-settings-btn" id="btnSubmit">
      СОХРАНИТЬ И ПРИМЕНИТЬ
    </button>
  </div>

  <!-- Вкладка 2: Лучшие сделки -->
  <div id="tab-deals" class="tab-content">
    <header>
      <div class="header-title">
        <h1>🔥 Лучшие сделки</h1>
        <p>Прямые ссылки на выгодные объявления</p>
      </div>
    </header>
    <div id="dealsList"></div>
  </div>

  <!-- Вкладка 3: Избранное -->
  <div id="tab-favorites" class="tab-content">
    <header>
      <div class="header-title">
        <h1>⭐ Избранное</h1>
        <p>Сохраненные объявления</p>
      </div>
    </header>
    <div id="favoritesList"></div>
  </div>

  <!-- Вкладка 4: Аналитика рынка -->
  <div id="tab-analytics" class="tab-content">
    <header>
      <div class="header-title">
        <h1>📊 Аналитика цен</h1>
        <p>Медиана и вилки по регионам</p>
      </div>
    </header>
    <div id="analyticsList"></div>
  </div>

  <!-- Нижний таббар -->
  <nav class="tabbar">
    <button class="tab-btn active" onclick="switchTab('tasks')">
      <span class="tab-icon">⚙️</span>
      <span class="tab-label">Поиски</span>
    </button>
    <button class="tab-btn" onclick="switchTab('deals')">
      <span class="tab-icon">🔥</span>
      <span class="tab-label">Сделки</span>
    </button>
    <button class="tab-btn" onclick="switchTab('favorites')">
      <span class="tab-icon">⭐</span>
      <span class="tab-label">Избранное</span>
    </button>
    <button class="tab-btn" onclick="switchTab('analytics')">
      <span class="tab-icon">📊</span>
      <span class="tab-label">Рынок</span>
    </button>
  </nav>

  <!-- Модальное окно -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="modalTitle">Настройка поиска</div>

      <div class="form-group">
        <label>Модель iPhone</label>
        <select id="selectModel" class="form-select">
          <option value="iPhone 16 Pro Max">iPhone 16 Pro Max</option>
          <option value="iPhone 16 Pro">iPhone 16 Pro</option>
          <option value="iPhone 16">iPhone 16</option>
          <option value="iPhone 15 Pro Max">iPhone 15 Pro Max</option>
          <option value="iPhone 15 Pro">iPhone 15 Pro</option>
          <option value="iPhone 15">iPhone 15</option>
          <option value="iPhone 14 Pro Max">iPhone 14 Pro Max</option>
          <option value="iPhone 14 Pro" selected>iPhone 14 Pro</option>
          <option value="iPhone 14">iPhone 14</option>
          <option value="iPhone 13 Pro Max">iPhone 13 Pro Max</option>
          <option value="iPhone 13 Pro">iPhone 13 Pro</option>
          <option value="iPhone 13">iPhone 13</option>
          <option value="iPhone 12 Pro Max">iPhone 12 Pro Max</option>
          <option value="iPhone 12 Pro">iPhone 12 Pro</option>
          <option value="iPhone 12">iPhone 12</option>
          <option value="iPhone 11">iPhone 11</option>
        </select>
      </div>

      <div class="form-group">
        <label>Город или область (Вся Россия)</label>
        <input type="text" id="inputCity" class="form-input" placeholder="Начните вводить любой город..." autocomplete="off">
        <div id="cityList" class="city-suggestions"></div>
      </div>

      <div class="input-row">
        <div class="form-group">
          <label>Мин. цена (₽)</label>
          <input type="number" id="inputMin" class="form-input" placeholder="10000">
        </div>
        <div class="form-group">
          <label>Макс. цена (₽)</label>
          <input type="number" id="inputMax" class="form-input" placeholder="85000">
        </div>
      </div>

      <div class="sheet-btns">
        <button class="btn-secondary" id="btnCancel">Отмена</button>
        <button class="btn-primary" id="btnSave">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let ALL_CITIES = [
      "Россия", "Кузбасс (область)", "Кемерово", "Новокузнецк", "Прокопьевск", "Ленинск-Кузнецкий", 
      "Белово", "Междуреченск", "Юрга", "Анжеро-Судженск", "Киселевск", "Осинники", "Березовский",
      "Новосибирск", "Томск", "Барнаул", "Красноярск", "Омск", "Иркутск", "Тюмень", "Екатеринбург",
      "Челябинск", "Москва", "Санкт-Петербург", "Казань", "Нижний Новгород", "Самара", "Уфа",
      "Ростов-на-Дону", "Краснодар", "Воронеж", "Пермь", "Волгоград", "Саратов", "Владивосток", "Хабаровск"
    ];

    fetch("https://raw.githubusercontent.com/pensnarik/russian-cities/master/russian-cities.json")
      .then(res => res.json())
      .then(data => {
        if (Array.isArray(data)) {
          const names = data.map(c => c.name);
          ALL_CITIES = Array.from(new Set([...ALL_CITIES, ...names]));
        }
      })
      .catch(() => {});

    let tasks = [];
    let liveDeals = [];
    let favorites = JSON.parse(localStorage.getItem("avito_favs") || "[]");
    let editTaskId = null;

    function safeDecode(b64) {
      try {
        let str = b64.replace(/-/g, "+").replace(/_/g, "/");
        while (str.length % 4) str += "=";
        const bin = atob(str);
        const bytes = Uint8Array.from(bin, m => m.codePointAt(0));
        return new TextDecoder().decode(bytes);
      } catch (e) {
        return "";
      }
    }

    function initData() {
      const urlParams = new URLSearchParams(window.location.search);
      let rawData = urlParams.get("d") || urlParams.get("data") || "";

      if (!rawData && window.location.hash && window.location.hash.length > 1) {
        rawData = window.location.hash.substring(1);
      }

      if (rawData) {
        try {
          const jsonText = safeDecode(rawData);
          if (jsonText) {
            const payload = JSON.parse(jsonText);

            // Если пришел объект с задачами и сделками
            if (payload && payload.t) {
              tasks = payload.t.map((t, idx) => ({
                id: String(t[0] || idx + 1),
                model: t[1] || "iPhone",
                city: t[2] || "Кемерово",
                min_price: parseInt(t[3]) || 10000,
                max_price: parseInt(t[4]) || 100000,
                avg_price: parseInt(t[5]) || 0
              }));
              if (Array.isArray(payload.d)) {
                liveDeals = payload.d.map(d => ({
                  title: d[0],
                  city: d[1],
                  price: d[2],
                  avg_price: d[3],
                  profit: d[4],
                  url: d[5],
                  memory: d[6]
                }));
              }
            } else if (Array.isArray(payload)) {
              // Старый формат массива
              tasks = payload.map((t, idx) => ({
                id: String(t[0] || t.id || idx + 1),
                model: t[1] || t.model || "iPhone",
                city: t[2] || t.city || "Кемерово",
                min_price: parseInt(t[3] || t.min_price) || 10000,
                max_price: parseInt(t[4] || t.max_price) || 100000,
                avg_price: parseInt(t[5] || t.avg_price) || 0
              }));
            }
          }
        } catch (e) {
          console.error("Decode error", e);
        }
      }

      document.getElementById("subTitle").innerText = `Отслеживается моделей: ${tasks.length}`;
      renderTasks();
      renderDeals();
      renderFavorites();
      renderAnalytics();
    }

    function formatPrice(num) {
      if (!num || num <= 0) return "—";
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽";
    }

    window.switchTab = function(tabName) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));

      const target = document.getElementById("tab-" + tabName);
      if (target) target.classList.add("active");

      const btns = document.querySelectorAll(".tab-btn");
      const order = ["tasks", "deals", "favorites", "analytics"];
      const idx = order.indexOf(tabName);
      if (idx !== -1 && btns[idx]) btns[idx].classList.add("active");

      if (tabName === "deals") renderDeals();
      if (tabName === "favorites") renderFavorites();
      if (tabName === "analytics") renderAnalytics();
    };

    function renderTasks() {
      const container = document.getElementById("taskList");
      container.innerHTML = "";

      if (!tasks || tasks.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px;">Список пуст.<br>Нажмите кнопку ниже, чтобы добавить модель.</div>`;
        return;
      }

      tasks.forEach((t) => {
        const card = document.createElement("div");
        card.className = "task-card";
        card.innerHTML = `
          <div class="task-top">
            <div>
              <div class="task-name">${t.model}</div>
              <div class="task-city-tag">📍 ${t.city}</div>
            </div>
            <div class="task-actions">
              <button class="icon-btn" onclick="openEdit('${t.id}')">✏️</button>
              <button class="icon-btn" style="color: var(--danger)" onclick="deleteTask('${t.id}')">🗑</button>
            </div>
          </div>

          <div class="task-meta">
            <div class="meta-box">
              <p>Диапазон цен</p>
              <p>${formatPrice(t.min_price)} — ${formatPrice(t.max_price)}</p>
            </div>
            <div class="meta-box">
              <p>Средний рынок</p>
              <p class="market-pill">${t.avg_price ? "~" + formatPrice(t.avg_price) : "Расчет..."}</p>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Вкладка «Сделки» с прямыми ссылками на Авито
    function openAvitoUrl(url) {
      if (tg && tg.openLink) {
        tg.openLink(url);
      } else {
        window.open(url, "_blank");
      }
    }

    function renderDeals() {
      const container = document.getElementById("dealsList");
      container.innerHTML = "";

      if (liveDeals.length > 0) {
        liveDeals.forEach(d => {
          const card = document.createElement("div");
          card.className = "deal-card";
          card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="deal-badge">🔥 Выгода ~${formatPrice(d.profit)}</div>
              <span style="font-size:12px; color:var(--text-muted);">📍 ${d.city}</span>
            </div>
            <div style="font-size:16px; font-weight:700;">${d.title} ${d.memory ? '<span style="font-size:13px; color:var(--blue); font-weight:normal;">(' + d.memory + ')</span>' : ''}</div>
            <div class="deal-price-row">
              <div class="deal-price">${formatPrice(d.price)}</div>
              <div class="deal-market">рынок ~${formatPrice(d.avg_price)}</div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr auto; gap:8px; margin-top:6px;">
              <button class="btn-avito" onclick="openAvitoUrl('${d.url}')">↗️ Открыть на Авито</button>
              <button class="icon-btn" onclick="toggleFav('${d.title}', '${d.city}', ${d.price}, '${d.url}')">⭐</button>
            </div>
          `;
          container.appendChild(card);
        });
      } else {
        // Если парсер ещё собирает данные, показываем ориентиры с поисковыми ссылками
        if (tasks.length === 0) {
          container.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:40px 0;">Добавьте модели в «Поисках».</div>`;
          return;
        }

        tasks.forEach(t => {
          if (!t.avg_price || t.avg_price <= 0) return;
          const goodPrice = Math.round(t.avg_price * 0.82);
          const profit = t.avg_price - goodPrice;
          const searchUrl = `https://m.avito.ru?q=${encodeURIComponent(t.model + ' ' + t.city)}&s=104`;

          const card = document.createElement("div");
          card.className = "deal-card";
          card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="deal-badge">🔥 Выгода от ~${formatPrice(profit)}</div>
              <span style="font-size:12px; color:var(--text-muted);">📍 ${t.city}</span>
            </div>
            <div style="font-size:16px; font-weight:700;">${t.model}</div>
            <div class="deal-price-row">
              <div>
                <span class="deal-price">${formatPrice(goodPrice)}</span>
                <span style="font-size:11px; color:#3fb950;">(таргет выкупа)</span>
              </div>
              <div class="deal-market">рынок ~${formatPrice(t.avg_price)}</div>
            </div>
            <button class="btn-avito" style="margin-top:6px;" onclick="openAvitoUrl('${searchUrl}')">↗️ Искать свежие предложения</button>
          `;
          container.appendChild(card);
        });
      }
    }

    // Вкладка «Избранное»
    window.toggleFav = function(title, city, price, url) {
      favorites.push({ id: Date.now(), title, city, price, url });
      localStorage.setItem("avito_favs", JSON.stringify(favorites));
      alert("⭐ Добавлено в Избранное!");
    };

    window.removeFav = function(id) {
      favorites = favorites.filter(f => f.id !== id);
      localStorage.setItem("avito_favs", JSON.stringify(favorites));
      renderFavorites();
    };

    function renderFavorites() {
      const container = document.getElementById("favoritesList");
      container.innerHTML = "";

      if (!favorites || favorites.length === 0) {
        container.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:40px 0;">У вас пока нет сохраненных предложений. Добавляйте их кнопкой ⭐ из «Сделок».</div>`;
        return;
      }

      favorites.forEach(f => {
        const card = document.createElement("div");
        card.className = "deal-card";
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:16px; font-weight:700;">${f.title}</span>
            <button class="icon-btn" style="color:var(--danger)" onclick="removeFav(${f.id})">🗑</button>
          </div>
          <div style="font-size:13px; color:var(--blue);">📍 ${f.city}</div>
          <div class="deal-price">${formatPrice(f.price)}</div>
          <button class="btn-avito" style="margin-top:4px;" onclick="openAvitoUrl('${f.url}')">↗️ Открыть объявление</button>
        `;
        container.appendChild(card);
      });
    }

    // Вкладка «Аналитика»
    function renderAnalytics() {
      const container = document.getElementById("analyticsList");
      container.innerHTML = "";

      if (tasks.length === 0) {
        container.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:40px 0;">Нет данных.</div>`;
        return;
      }

      tasks.forEach(t => {
        const avg = t.avg_price || Math.round(t.min_price + (t.max_price - t.min_price) * 0.45);
        const buyTarget = Math.round(avg * 0.80);
        const sellTarget = Math.round(avg * 0.98);

        const card = document.createElement("div");
        card.className = "stat-card";
        card.innerHTML = `
          <div style="font-size:16px; font-weight:700;">${t.model} <span style="font-size:12px; font-weight:normal; color:var(--text-muted);">(${t.city})</span></div>
          <div class="task-meta" style="margin-top:8px;">
            <div class="meta-box">
              <p>Средний рынок</p>
              <p class="market-pill">~${formatPrice(avg)}</p>
            </div>
            <div class="meta-box">
              <p>Вход (выкуп)</p>
              <p class="profit-pill">до ${formatPrice(buyTarget)}</p>
            </div>
            <div class="meta-box" style="grid-column: span 2; margin-top:4px;">
              <p>Рекомендованная цена быстрой продажи</p>
              <p style="color:#fff; font-size:13px;">${formatPrice(sellTarget)} (маржа ~${formatPrice(sellTarget - buyTarget)})</p>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Сохранение настроек
    document.getElementById("btnSubmit").addEventListener("click", () => {
      if (!tg) {
        alert("Откройте приложение внутри Telegram");
        return;
      }
      tg.sendData(JSON.stringify(tasks));
    });

    // Автокомплит городов
    const inputCity = document.getElementById("inputCity");
    const cityList = document.getElementById("cityList");

    inputCity.addEventListener("input", () => {
      const val = inputCity.value.trim().toLowerCase();
      cityList.innerHTML = "";
      if (!val) { cityList.style.display = "none"; return; }

      const startsWith = [];
      const contains = [];
      for (let i = 0; i < ALL_CITIES.length; i++) {
        const c = ALL_CITIES[i];
        const low = c.toLowerCase();
        if (low.startsWith(val)) startsWith.push(c);
        else if (low.includes(val)) contains.push(c);
        if (startsWith.length + contains.length > 25) break;
      }
      const matches = [...startsWith, ...contains].slice(0, 15);
      if (matches.length === 0) { cityList.style.display = "none"; return; }

      matches.forEach(cityName => {
        const item = document.createElement("div");
        item.className = "city-item";
        item.innerText = cityName;
        item.addEventListener("click", () => {
          inputCity.value = cityName;
          cityList.style.display = "none";
        });
        cityList.appendChild(item);
      });
      cityList.style.display = "block";
    });

    document.addEventListener("click", (e) => {
      if (!inputCity.contains(e.target) && !cityList.contains(e.target)) cityList.style.display = "none";
    });

    // Модалка
    const modal = document.getElementById("modal");
    const btnOpenAdd = document.getElementById("btnOpenAdd");
    const btnCancel = document.getElementById("btnCancel");
    const btnSave = document.getElementById("btnSave");

    btnOpenAdd.addEventListener("click", () => {
      editTaskId = null;
      document.getElementById("modalTitle").innerText = "Новый поиск";
      document.getElementById("selectModel").value = "iPhone 14 Pro";
      document.getElementById("inputCity").value = "Кемерово";
      document.getElementById("inputMin").value = "35000";
      document.getElementById("inputMax").value = "90000";
      cityList.style.display = "none";
      modal.classList.add("active");
    });

    btnCancel.addEventListener("click", () => modal.classList.remove("active"));

    window.openEdit = function(id) {
      const task = tasks.find(x => String(x.id) === String(id));
      if (!task) return;
      editTaskId = id;
      document.getElementById("modalTitle").innerText = "Редактирование";
      document.getElementById("selectModel").value = task.model || "iPhone 14 Pro";
      document.getElementById("inputCity").value = task.city || "Кемерово";
      document.getElementById("inputMin").value = task.min_price || 10000;
      document.getElementById("inputMax").value = task.max_price || 90000;
      cityList.style.display = "none";
      modal.classList.add("active");
    };

    window.deleteTask = function(id) {
      tasks = tasks.filter(x => String(x.id) !== String(id));
      document.getElementById("subTitle").innerText = `Отслеживается моделей: ${tasks.length}`;
      renderTasks();
      renderDeals();
      renderAnalytics();
    };

    btnSave.addEventListener("click", () => {
      const model = document.getElementById("selectModel").value;
      const city = document.getElementById("inputCity").value.trim() || "Кемерово";
      const minP = parseInt(document.getElementById("inputMin").value) || 5000;
      const maxP = parseInt(document.getElementById("inputMax").value) || 150000;

      if (editTaskId) {
        const item = tasks.find(x => String(x.id) === String(editTaskId));
        if (item) {
          item.model = model;
          item.city = city;
          item.min_price = minP;
          item.max_price = maxP;
        }
      } else {
        tasks.push({
          id: String(Date.now()),
          model: model,
          city: city,
          min_price: minP,
          max_price: maxP,
          avg_price: 0
        });
      }

      document.getElementById("subTitle").innerText = `Отслеживается моделей: ${tasks.length}`;
      modal.classList.remove("active");
      renderTasks();
      renderDeals();
      renderAnalytics();
    });

    initData();
  </script>
</body>
</html>
